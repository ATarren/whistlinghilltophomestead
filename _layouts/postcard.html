---
layout: default
---
<article class="postcard-page">
  <p class="eyebrow">{{ page.date | date: "%B %-d, %Y" }}</p>
  <h1>{{ page.title }}</h1>
  <img class="postcard-image" src="{{ page.image | relative_url }}" alt="{{ page.image_alt }}">
  <div class="postcard-copy">
    {{ content }}
  </div>
  <p><a href="{{ '/' | relative_url }}#past-postcards">Browse past postcards</a></p>
</article>
