<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Welcome to Whistling Hilltop Homestead.">
    <title>{{ page.title }} | {{ site.name }}</title>
    <link rel="icon" type="image/svg+xml" href="{{ '/images/sprout.svg' | relative_url }}">
    <link rel="stylesheet" href="{{ '/css/main.css' | relative_url }}?v=20261109f">
    <style>
      /* Fade the map into the paper color behind the site name and navigation. */
      body::before {
        background: linear-gradient(
          to bottom,
          var(--paper) 0%,
          var(--paper) 12%,
          rgba(245, 241, 234, .92) 28%,
          rgba(232, 235, 226, .96) 58%,
          var(--map-back) 100%
        );
      }

      body::after {
        -webkit-mask-image: linear-gradient(
          to bottom,
          transparent 0%,
          rgba(0, 0, 0, .12) 16%,
          rgba(0, 0, 0, .55) 42%,
          #000 68%
        );
        mask-image: linear-gradient(
          to bottom,
          transparent 0%,
          rgba(0, 0, 0, .12) 16%,
          rgba(0, 0, 0, .55) 42%,
          #000 68%
        );
      }

      @media (max-width: 700px) {
        body::before {
          background: linear-gradient(
            to bottom,
            var(--paper) 0%,
            var(--paper) 10%,
            rgba(245, 241, 234, .92) 28%,
            rgba(232, 235, 226, .96) 58%,
            var(--map-back) 100%
          );
        }
      }
    </style>
    {% if page.url == '/' %}
    <style>
      /* Homepage: the map ends between the intro text and the button. */
      body::before,
      body::after {
        height: var(--map-height, 590px);
      }
    </style>
    {% endif %}
  </head>
  <body>
    <header class="site-header">
      <a class="site-name" href="{{ '/' | relative_url }}">{{ site.name }}</a>
      <nav aria-label="Main navigation">
        <ul>
          <li><a href="{{ '/' | relative_url }}">Home</a></li>
          <li><a href="{{ '/#homestead' | relative_url }}">Our Homestead</a></li>
          <li><a href="{{ '/#journal' | relative_url }}">Today's Postcard</a></li>
          <li><a href="{{ '/past-postcards/' | relative_url }}">Past Postcards</a></li>
          <li><a href="{{ '/awards-projects/' | relative_url }}">Awards &amp; Projects</a></li>
          <li><a href="{{ '/#contact' | relative_url }}">Send us a note</a></li>
        </ul>
      </nav>
    </header>
    <main class="container">
      {{ content }}
    </main>
    <footer>
      <p>Whistling Hilltop Homestead</p>
      <p><a href="mailto:easthillhomestead60@gmail.com">easthillhomestead60@gmail.com</a></p>
    </footer>
    {% if page.url == '/' %}
    <script>
      // End the map in the gap between the welcome text and the "Come on in" button.
      (function () {
        var intro = document.querySelector('.hero .intro');
        var button = document.querySelector('.hero .button');
        if (!intro || !button) return;

        function setMapHeight() {
          var introBottom = intro.getBoundingClientRect().bottom + window.pageYOffset;
          var buttonTop = button.getBoundingClientRect().top + window.pageYOffset;
          var gap = buttonTop - introBottom;
          var offset = gap > 24 ? Math.min(gap * 0.4, 20) : Math.max(gap / 2, 0);
          document.body.style.setProperty('--map-height', Math.round(introBottom + offset) + 'px');
        }

        setMapHeight();
        window.addEventListener('load', setMapHeight);
        window.addEventListener('resize', setMapHeight);
        window.addEventListener('orientationchange', setMapHeight);
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(setMapHeight);
        }
      })();
    </script>
    {% endif %}
  </body>
</html>
